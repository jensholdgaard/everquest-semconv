groups:
  - id: event.everquest.character.profile
    type: event
    name: everquest.character.profile
    stability: development
    brief: >
      A character as its client last saw it: identity, base stats, AA, the 21 equipment slots
      by item id and, from newer clients, the character sheet as drawn. Emitted on `/magelo`,
      on a zone change at most every ten minutes, and by the guild bot for a `/roster upload`.
    note: >
      The body is JSON: `name`, `level`, `class`, `race`, `gender`, `deity`, `guild`,
      `base_stats` (str, sta, cha, dex, int, agi, wis), `sheet` (client only), `aa`
      (`spent`, `unspent`), `aa_abilities` (`[index, rank]` pairs), `equipment`
      (`{slot, id, name, count}`, slots named `Ear1` .. `Ammo` in the client's order), and
      `reason`; an upload adds `source`. Bags, bank and coin are never part of it.
    attributes:
      - ref: everquest.character.name
        requirement_level: required
      - ref: everquest.character.class
        requirement_level: recommended
      - ref: everquest.character.level
        requirement_level: recommended
      - ref: everquest.profile.reason
        requirement_level: recommended
      - ref: everquest.profile.source
        requirement_level:
          conditionally_required: when the profile did not come from the running client

  - id: event.everquest.combat.death
    type: event
    name: everquest.combat.death
    stability: development
    brief: >
      An entity died in the zone: the server's death packet, carrying the spawn id of what
      died and of what killed it. Emitted by every client in the zone that runs the meter.
    note: >
      This is the kill signal. A lockout notice reaches only the raiders who earned one, a
      chat line names the kind and not the individual; the death packet is sent to the whole
      zone for every death and names the spawn. Consumers dedupe on zone, spawn id and time,
      since several reporters see the same death. Player deaths are included: a wipe is a
      burst of them.
    attributes:
      - ref: everquest.combat.target
        requirement_level: required
      - ref: everquest.spawn.id
        requirement_level: required
      - ref: everquest.spawn.name
        requirement_level: recommended
      - ref: everquest.combat.source
        requirement_level: recommended
      - ref: everquest.zone.name
        requirement_level: recommended
      - ref: everquest.character.name
        requirement_level: recommended
