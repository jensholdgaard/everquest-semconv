name: everquest
description: |
  Semantic conventions for EverQuest telemetry: the Zeal client (OTLP/HTTP) and
  the eqmacemu server share one `everquest.*` attribute registry and its
  signals (metrics, logs, spans) across the EverQuest observability stack.
schema_url: https://raw.githubusercontent.com/jensholdgaard/everquest-semconv/main/schema/0.1.0.yaml
# The server's signals reference standard attributes (db.*, rpc.*, server.*).
dependencies:
  - schema_url: https://opentelemetry.io/schemas/1.40.0
    registry_path: https://github.com/open-telemetry/semantic-conventions@v1.40.0[model]
# Standard signals the server emits as-is; importing them lets live-check
# validate them (and the resource) against the OpenTelemetry definitions.
imports:
  events:
    - feature_flag.evaluation
  metrics:
    - rpc.server.call.duration
    - db.client.operation.duration
  entities:
    - service
    - telemetry.sdk
