groups:
  - id: entity.everquest.character
    type: entity
    name: everquest.character
    stability: development
    brief: >
      An EverQuest player character — the entity that telemetry is produced for.
      Its identifying and descriptive attributes are carried as OTLP resource
      attributes on every signal.
    attributes:
      - ref: everquest.character.name
        role: identifying
      - ref: everquest.character.class
        role: descriptive
      - ref: everquest.character.level
        role: descriptive
      - ref: everquest.character.deity
        role: descriptive
      - ref: everquest.character.aa.unspent
        role: descriptive
