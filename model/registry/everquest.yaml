groups:
  - id: registry.everquest
    type: attribute_group
    display_name: EverQuest Attributes
    brief: >
      Attributes describing EverQuest telemetry emitted by the Zeal client.
    attributes:
      - id: everquest.character.name
        type: string
        stability: development
        brief: The name of the player character the telemetry was emitted for.
        examples: ["Controels", "Scryll"]
        note: |
          > [!WARNING]
          >
          > Character names are user-chosen handles and MAY be considered
          > personal data depending on the server and jurisdiction.

      - id: everquest.character.class
        type: string
        stability: development
        brief: The character's class (archetype).
        examples: ["Bard", "Cleric", "Warrior"]

      - id: everquest.character.level
        type: int
        stability: development
        brief: The character's level.
        examples: [60, 1]

      - id: everquest.character.deity
        type: int
        stability: development
        brief: The numeric identifier of the character's deity.
        examples: [201, 396]

      - id: everquest.character.aa.unspent
        type: int
        stability: development
        brief: The number of unspent Alternate Advancement (AA) points.
        examples: [0, 12]

      - id: everquest.character.stat.name
        type:
          members:
            - id: strength
              value: "strength"
              stability: development
            - id: stamina
              value: "stamina"
              stability: development
            - id: dexterity
              value: "dexterity"
              stability: development
            - id: agility
              value: "agility"
              stability: development
            - id: wisdom
              value: "wisdom"
              stability: development
            - id: intelligence
              value: "intelligence"
              stability: development
            - id: charisma
              value: "charisma"
              stability: development
        stability: development
        brief: Which base stat a `everquest.character.stat` measurement refers to.
        note: >
          Previously modelled as a template attribute, which meant the seven names were written by
          hand at the call site with nothing checking them - the exact failure the registry exists
          to prevent. As a closed set they are generated, and a typo does not compile.

      - id: everquest.combat.pet.name
        type: string
        stability: development
        brief: >
          The pet that actually dealt the damage, when the attacker was a pet. Absent when the
          owner swung themselves.
        note: |
          `everquest.combat.source` stays the **owner** even for pet damage, so totals match how
          raiders already count - the community parser merges pets into their owner and labels the
          row "Cothaholic +Pets". This attribute keeps the pet visible underneath that, so a
          magician can see how much of their output was the pet without the pet becoming a separate
          contestant on the meter.

          > [!CAUTION]
          >
          > Swarm pets are the cardinality hazard here. They arrive several at a time, live for
          > under a minute, and each carries its own generated name, so one fight can mint dozens of
          > values that will never be seen again. With cumulative temporality the SDK keeps every
          > one of them for the life of the process and counts them against its 2000-set limit -
          > and overflow drops `target` and `source` along with them.
          >
          > If swarm pets are ever recorded, their names should be collapsed to a single value
          > before this attribute is set. The owner is the thing anyone actually asks about.
        examples: ["Chryscat", "Gaseker"]

      - id: everquest.heal.chain.handoff.ms
        type: int
        stability: development
        brief: >
          Milliseconds between the previous cleric's "GO - <name>" cue and this caster's own
          Complete Heal announcement.
        note: >
          The chain's health shows here before it shows in coverage. A gap in the timeline
          says the chain slipped; this says who was slow to answer their cue, which is the
          difference between a rotation that needs reordering and one person who needs a
          louder trigger. Absent when no cue preceded the cast - the leading cleric starts
          the line unprompted.
        examples: [420, 3100]

      - id: everquest.heal.chain.position
        type: int
        stability: development
        brief: >
          The caster's assigned slot in a Complete Heal rotation, as announced by their macro
          (the "1" in "1 - CH - Tank (100)").
        note: >
          Set by hand in each cleric's macro and reassigned per raid, so it describes the
          rotation as the raid intended it - which is exactly what makes it worth recording.
          Comparing the announced slot order against the order casts actually landed in is how
          you tell "the chain was too slow" from "someone cast out of turn".
        examples: [1, 5, 9]

      - id: everquest.heal.caster.mana.percent
        type: int
        stability: development
        brief: >
          The caster's remaining mana as a percentage (0-100) at the moment a Complete Heal
          was announced, as reported by their own macro.
        note: >
          Self-reported by the casting client through a chat macro, and therefore only as
          accurate and as present as that macro. It is recorded because a chain that starts
          breaking down usually shows here first - a cleric's mana falling cast over cast
          predicts the gap before the gap happens.
        examples: [92, 14]

      - id: everquest.zone.id
        type: int
        stability: development
        brief: The numeric identifier of the zone the character is currently in.
        examples: [169, 1]

      - id: everquest.zone.name
        type: string
        stability: development
        brief: The human-readable short name of the zone the character is in.
        examples: ["Mons Letalis", "North Qeynos"]

      - id: everquest.chat.color
        type: int
        stability: development
        brief: >
          The EverQuest chat color index of a log line, identifying the message
          channel/category (e.g. spell, melee, system).
        examples: [273, 0]

      - id: everquest.combat.source
        type: string
        stability: development
        brief: >
          The attacker credited with the damage. Pets are rolled into their owner (via the live
          pet→owner link), so a pet's damage is credited to the owning player. Enables per-source DPS.
        examples: ["Abuelo", "Controels", "a temple guard"]

      - id: everquest.combat.source_type
        type:
          members:
            - id: player
              value: "player"
              stability: development
              brief: The source is a player character (or a player's pet, rolled into the player).
            - id: npc
              value: "npc"
              stability: development
              brief: The source is an NPC.
            - id: unknown
              value: "unknown"
              stability: development
              brief: The source could not be matched in the live entity list.
        stability: development
        brief: >
          Classification of the damage source from the client's live entity list — lets a shared
          meter filter to players without heuristics.

      - id: everquest.combat.target
        type: string
        stability: development
        brief: >
          The kind of spawn the damage was dealt to, with the instance suffix removed and
          underscores replaced by spaces (`A_Centi_Dator023` becomes `A Centi Dator`).
        note: >
          The instance suffix is a spawn ID, and OpenTelemetry is explicit that IDs do not belong
          in metric attributes: each distinct value mints a timeseries, so a camp of respawning
          mobs walks the metric toward the cardinality limit while answering nothing anyone asks.
          It also splits one mob across pulls, when "how much damage went onto that target" is the
          question being asked.

          Fight spans keep the raw, instance-suffixed name instead: a trace describes one
          encounter, so two mobs of the same name pulled together must stay distinct there.
        examples: ["A Centi Dator", "A Shissar Revenant"]

      - id: everquest.combat.direction
        type:
          members:
            - id: outgoing
              value: "outgoing"
              stability: development
              brief: Damage dealt by the source (onto its target).
            - id: incoming
              value: "incoming"
              stability: development
              brief: Damage received by the local player.
        stability: development
        brief: Direction of combat damage relative to the local player.

      - id: everquest.combat.damage.type
        type: string
        stability: development
        brief: >
          The kind of damage: a weapon/skill class ("slash", "crush", "pierce",
          "bash", "kick", "hth", "backstab", "archery", "throwing", "special", or
          "melee" for anything unrecognised), "spell" for direct spell damage,
          "dot" for a damage-over-time tick, or "damage_shield".
        note: >
          Derived from the damage packet's type field, which carries
          SkillDamageTypes[skill] rather than the skill itself - a lookup that
          collapses 1H and 2H variants onto one value (both blunts report 0, both
          slashes 1) and maps hand-to-hand to 4, kicks to 30, piercing to 36.
          Reading it as a SkillType coincidentally works for slash and bash and
          mislabels the rest.

          Damage shields are identified by the same field carrying a
          DmgShieldType (244-249).
          Without that test they are indistinguishable from spell damage (a
          buff-granted shield carries a spell id) or from melee (item and innate
          shields carry no spell id at all).
        examples: ["slash", "crush", "pierce", "spell", "dot", "damage_shield"]

      - id: everquest.group.leader
        type: string
        stability: development
        brief: >
          Name of the group's leader, which identifies the group the telemetry was
          produced in. Omitted entirely when the character is not grouped.
        note: >
          The leader names the group in preference to a hash of the roster: a roster
          identifier changes the moment anyone joins or leaves, splitting a timeseries
          mid-fight, whereas leadership rarely changes hands. Raids are not covered -
          each of a raid's groups reports its own leader.
        examples: ["Controels", "Zigzap"]

      - id: everquest.fight.outcome
        type:
          members:
            - id: killed
              value: "killed"
              stability: development
              brief: The mob died (a slain message matched).
            - id: idle
              value: "idle"
              stability: development
              brief: No damage for 30s — mob fled, reset, or the group moved on.
            - id: zoned
              value: "zoned"
              stability: development
              brief: The reporting player left the zone mid-fight.
        stability: development
        brief: How a fight (encounter span) ended.

      - id: everquest.fight.damage.dealt
        type: int
        stability: development
        brief: Total damage the reporter observed dealt to the target during the fight.

      - id: everquest.fight.damage.taken
        type: int
        stability: development
        brief: Total damage the reporter took from the target during the fight.

      - id: everquest.raid.target
        type: string
        stability: development
        brief: >
          The raid encounter a lockout applies to, as named by the server in the
          lockout notice.
        examples: ["Prince Selrach Di`zok"]

      - id: everquest.spell.name
        type: string
        stability: development
        brief: The name of the spell or song involved in the telemetry.
        examples: ["Chant of Battle", "Complete Heal"]

      - id: everquest.discipline.name
        type: string
        stability: development
        brief: The name of the combat discipline that is active.
        examples: ["Defensive", "Evasive"]
