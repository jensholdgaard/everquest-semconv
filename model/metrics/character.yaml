groups:
  - id: metric.everquest.character.attack
    type: metric
    metric_name: everquest.character.attack
    stability: development
    brief: >
      The character's current offense (attack) rating. A gauge so it can be
      overlaid against `everquest.combat.damage` to correlate DPS with gear and buffs,
      without putting item identity into metric attributes.
    instrument: gauge
    unit: "1"
    entity_associations:
      - everquest.character

  - id: metric.everquest.character.haste
    type: metric
    metric_name: everquest.character.haste
    stability: development
    brief: >
      The character's current total effective melee haste (worn + spell +
      overhaste), as a percentage. Gauge, sampled over time for DPS correlation.
    instrument: gauge
    unit: "%"
    entity_associations:
      - everquest.character

  - id: metric.everquest.character.stat
    type: metric
    metric_name: everquest.character.stat
    stability: development
    brief: >
      A character's current base stat value, recorded when it changes.
    note: >
      These change on an event - swapping gear, a buff landing, levelling - which is the case the
      spec points a *synchronous* gauge at. It is implemented as an observable one anyway: the
      synchronous Gauge instrument is gated behind OPENTELEMETRY_ABI_VERSION_NO >= 2 in the C++ API,
      a preview ABI, and moving every instrument in a client that other people run onto unstable
      interfaces is not a trade worth making for the distinction.

      The observable outcome is the same. A gauge sampled on the export interval still shows a clean
      step when gear changes, so "when did this change?" - the only interesting question about a
      stat - remains answerable from the series.
    instrument: gauge
    unit: "1"
    entity_associations:
      - everquest.character
    attributes:
      - ref: everquest.character.stat.name
        requirement_level: required
      - ref: everquest.character.name
        requirement_level: required
