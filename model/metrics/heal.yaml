groups:
  - id: metric.everquest.combat.heal
    type: metric
    metric_name: everquest.combat.heal
    stability: development
    brief: >
      Total healing done or received by the player, accumulated from caster-side heal messages.
      Only the involved client sees heal amounts, so each player self-reports — the shared meter
      sums cleanly without double counting. `everquest.combat.direction` outgoing = healing done,
      incoming = healing received.
    note: >
      On Project Quarm, healing done is not observable at all. Mob::HealDamage messages
      only the target ("message to target", YOU_HEALED) and sends the healer nothing -
      so no client, not even the healer's own, learns how much it healed. The client's
      string table does contain "You have healed %1 for %2", but this server never
      sends it, and heal-over-time ticks are messaged to nobody (`!hot`).

      Healing is therefore recorded from the receiving side, which is the only witness.
      Consumers should read this metric as healing RECEIVED, not healing done.

      For direction=incoming the source attribute is the character who was *healed*,
      not the healer: the message does not name whoever cast it, so there is nothing
      truthful to put there.
    instrument: counter
    unit: "{hitpoint}"
    entity_associations:
      - everquest.character
    attributes:
      - ref: everquest.combat.source
        requirement_level: recommended
      - ref: everquest.combat.direction
        requirement_level: required
      - ref: everquest.zone.name
        requirement_level: recommended
      - ref: everquest.group.leader
        requirement_level: opt_in
